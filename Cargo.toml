[package]
name = "spar-cli"
version = "0.3.2"
edition = "2021"
rust-version = "1.85"
description = "Two AI coding agents alternate implementing and reviewing GitHub issues until a PR converges."
license = "MIT"
repository = "https://github.com/coreyphillips/spar"
readme = "README.md"
keywords = ["github", "code-review", "agents", "automation", "cli"]
categories = ["command-line-utilities", "development-tools"]
exclude = ["/.github", "/target", "/.idea", "/.vscode"]

# The crate is `spar-cli` because `spar` is taken on crates.io by an unrelated
# config parser. The binary is `spar`, which is what you actually type.
[[bin]]
name = "spar"
path = "src/main.rs"

[lib]
name = "spar"
path = "src/lib.rs"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = { version = "1", features = ["preserve_order"] }
regex = "1.13"
sha1 = "0.10"
sha2 = "0.11"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]

[profile.release]
opt-level = 2
lto = "thin"
codegen-units = 1
strip = true
