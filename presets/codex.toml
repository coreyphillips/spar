# OpenAI Codex. Ships inside the ChatGPT desktop app on macOS, or standalone.
#
# Note: `codex exec review` is deliberately not used. It refuses a custom prompt
# alongside --base and returns prose regardless of --output-schema, so it cannot
# produce a machine-checkable verdict.
command = [
  "codex", "exec", "--json", "--skip-git-repo-check",
  ["-s", "workspace-write"],
  ["-m", "{model}"],
  ["-c", "model_reasoning_effort={effort}"],
  ["-C", "{cwd}"],
  ["--output-schema", "{schema_file}"],
  "--", "{prompt}",
]
output = "jsonl"
message_path = "item.text"
search_paths = [
  "/Applications/ChatGPT.app/Contents/Resources",
  "~/.codex/bin",
  "/opt/homebrew/bin",
  "/usr/local/bin",
  "~/.local/bin",
]

# Hints for `spar init`. Never validated against, only written as comments.
#
# Codex enumerates neither set in its help, so these were read out of the
# binary: the effort list is its own enum, in its own order, and the models are
# the current generation of those it names. Which models an account may
# actually call is a separate question from which ones exist, so treat the list
# as a starting point rather than a promise.
models = ["gpt-5.6-sol", "gpt-5.6-terra", "gpt-5.6-luna", "gpt-5.6-pro", "gpt-5.5"]
efforts = ["ultra", "max", "xhigh", "high", "medium", "low", "minimal", "none"]
options_note = "Codex lists neither set in its help. Your ~/.codex/config.toml is the source of truth for what your account has, and effort is passed through as -c model_reasoning_effort=..."

[message_match]
type = "item.completed"
"item.type" = "agent_message"
