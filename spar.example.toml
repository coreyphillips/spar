# Copy to spar.toml, or run `spar init` to generate one from the CLIs you
# actually have installed. Each agent inherits a command template from a preset
# compiled into the binary; anything set here overrides it.

[agents.claude]
preset = "claude"
model  = "fable"      # fable | opus | sonnet, or a full name like claude-fable-5
effort = "high"       # high | low | medium | xhigh | max
                      # Omit either line to use the CLI's own default.
                      # Check the current sets with: claude --help

[agents.codex]
preset = "codex"
model  = "gpt-5.6-sol"  # gpt-5.6-sol | gpt-5.6-terra | gpt-5.6-luna |
                        # gpt-5.6-pro | gpt-5.5
effort = "ultra"        # ultra | max | xhigh | high | medium | low | minimal |
                        # none
                        # Codex lists neither set in its help, so these were
                        # read out of the binary. Your ~/.codex/config.toml is
                        # the source of truth for what your account can call,
                        # and effort passes through as
                        # -c model_reasoning_effort=...

# Everything a preset supplies can be overridden per agent. The full set:
#
#   preset       = "claude"     # inherit a built in command template
#   models       = ["a", "b"]   # hints only, written into a config generated by
#   efforts      = ["a", "b"]   # `spar init` as comments. Never validated
#   options_note = "..."        # against, so a value not listed still works.
#   model        = "fable"      # omit to use the CLI's own default
#   effort       = "high"       # omit to use the CLI's own default
#   command      = [...]        # a template of your own, instead of a preset
#   output       = "text"       # text | jsonl | json
#   timeout      = 3600         # seconds one call may take before spar gives up.
#                               # A timeout costs the whole call and is never
#                               # retried, so err long.
#   search_paths = ["~/.local/bin"]   # extra places to look for the binary
#   system_via   = "prompt"     # prompt | placeholder. Where the style rules go
#   message_path = "item.text"  # jsonl only: where the answer lives
#   [agents.NAME.message_match] # jsonl only: which event carries the answer
#   [agents.NAME.fallback]      # a stand in for when this CLI cannot answer
#
# A fallback is a whole agent, preset and all, and it is not a third opinion. It
# never reviews alongside the pair: it answers in place of the agent that
# failed, holding that agent's turn, so neither agent ever reviews its own most
# recent edit. Without one, a CLI that is down, out of quota, or refusing the
# request on policy grounds takes the whole run with it.
#
#   [agents.codex.fallback]
#   preset = "cursor"
#   model  = "kimi-k3-max"
#
# It fires once the primary has spent its own retries, and on a deadline too: a
# different CLI is a different question. `spar doctor` shows it under the agent
# it stands in for, and SPAR_CODEX_FALLBACK_BIN points it somewhere else. One
# that is not installed warns at startup and is otherwise ignored, because a
# missing backup should not stop a run whose pair is fine.
#
# Any two agents work. To pair different CLIs, point at other presets:
#   [agents.gemini]
#   preset = "gemini"
#
# Or declare a command template inline, with no preset at all. An argument group
# whose placeholder is unset is dropped whole, so omitting `model` drops the
# `-m` flag rather than passing an empty string.
#
#   [agents.custom]
#   command = ["mytool", ["-m", "{model}"], "--prompt", "{prompt}"]
#   output  = "text"
#   timeout = 7200            # a slow model on a large repo
#
# Placeholders: {prompt} {system} {model} {effort} {cwd} {schema} {schema_file}
#
# Editing calls leave working tree changes uncommitted. Spar stages and commits
# them after accepting the structured report, so a linked worktree does not
# need additional writable access to Git metadata. A changed .gitattributes is
# kept for recovery instead of staged, because it can select an external filter.
# Changed gitlinks are kept too, since their objects may exist only in a nested
# repository. On Unix, remaining child processes are stopped before inspection.
# Elsewhere, the configured command must wait for its children before returning.
# Ignored files outside known build and cache directories stop a managed commit.
# Recognized build artifacts are kept with a warning but do not block it.
#
# Include {schema} or {schema_file} and spar uses the CLI's native structured
# output, which is worth doing: without it spar asks for JSON in the prompt and
# parses whatever comes back, and a long answer that hits the model's output
# limit stops mid-object and is lost. {schema} passes the schema as an argument
# (Claude Code), {schema_file} passes a path to it (Codex).
#
# For a CLI that emits an event stream rather than plain text, say where the
# answer lives:
#
#   [agents.custom]
#   command      = ["mytool", "--json", "{prompt}"]
#   output       = "jsonl"
#   message_path = "item.text"
#   [agents.custom.message_match]
#   type        = "item.completed"
#   "item.type" = "agent_message"

[loop]
max_rounds        = 3        # in the custody loop, review rounds ONE invocation
                             # may spend asking for changes. A full-budget run
                             # may use one extra closing pass. In `spar review`,
                             # this selects up to three phases: independent
                             # review, cross-adjudication, and rebuttal. Resuming
                             # a custody run grants a fresh budget.
auto_merge        = false    # off on purpose: two models agreeing is not the
                             # same as being right, and neither carries the
                             # consequences of a bad merge
first_implementor = "claude"
base_branch       = "main"   # only a fallback; origin/HEAD wins when it exists
worktrees         = true     # isolate each issue in its own git worktree
keep_worktrees    = false    # keep them after a run, for inspection
branch_prefix     = ""       # branches are issue-N, pr-N, and split-N-I, with
                             # a suffix on repeats. Set e.g. "spar/" to namespace.
close_skipped     = true     # close an issue both agents independently declined,
                             # after posting the shared reasoning. Never applies
                             # to a tracking issue: declining to open a PR for
                             # an umbrella is right, closing it while its parts
                             # are still open is not, and either agent calling
                             # it one is enough to hold it open.
min_number        = 0        # ignore issues and PRs numbered below this when
                             # spar is picking for itself. 0 is no floor. A long
                             # lived repo carries a tail of old issues nobody is
                             # going to reach, and spar takes the LOWEST numbered
                             # open items, so without a floor it walks straight
                             # into them. A number you name explicitly is always
                             # honoured.
parallel_triage   = true     # both agents triage at once; they only read
absorb_new_issues = 0        # waves of newly filed follow-ups to fold back into
                             # the same run rather than leaving them for the
                             # next one. 0 is off. Each wave is triaged like any
                             # other issue, so both agents still have to agree.
                             # Multiplies what a run costs.
decompose_trackers = false   # read the checklist in a tracking issue as work:
                             # file an issue for each unchecked item that has
                             # none, link one to the issue that already covers
                             # it, work the children in this run, and tick an
                             # item off once its issue is closed. The number is
                             # written back beside the item, so the body is the
                             # record and there is no state file to go stale.
                             # Off by default, for the reason
                             # file_non_blocking is: a tracker exists to
                             # contain many things. Only ever acts on markdown
                             # task list items, so it is opt in per issue too,
                             # and `spar triage` prints the whole decomposition
                             # without writing any of it. spar checks a box and
                             # never unchecks one.
max_tracker_children = 5     # most issues one run will file from one tracker's
                             # checklist. A cap, not a target, and it counts
                             # only new issues: an item that already links one
                             # needs a tick or an adoption, never a filing, so
                             # it is free. What the cap left is named out loud.
followups         = "local"  # issues | local | none. Where a follow-up goes.
                             # local writes .spar/followups.md and leaves the
                             # tracker alone, which is the default because a
                             # thorough reviewer always finds something and a
                             # tracker is somebody's queue. `spar followup`
                             # works that file: it screens each note against
                             # the code as it is now, files the ones that still
                             # hold, and takes them out of the queue.
file_non_blocking = false    # file a non-blocking finding as a follow-up. Off,
                             # and this is the setting that stops a run breeding:
                             # with it on, one issue produced ten follow-ups,
                             # four of which produced more. Not gating a merge is
                             # not the same as deserving a triage queue.
file_nits         = false    # nits stay in the PR thread, never a follow-up
max_followups     = 5        # most one run may record before it stops and says
                             # what it dropped. A backstop, not a target.
max_split_parts   = 4        # most parts `spar split` makes out of one issue or
                             # pull request. A backstop against a queue nobody
                             # asked for, and what it holds back is said out
                             # loud. A part is never itself split, so if one is
                             # still too big, `spar split <part>` is one command
                             # away.
state_store       = "local"  # local | pr | both. local keeps resume state in
                             # .spar/state and off the PR
drafts            = "never"  # never | until_approved | always. Whether a pull
                             # request spar opens starts as a draft.
                             # until_approved opens one and marks it ready the
                             # moment the review has no blocking findings left,
                             # which is what the draft was saying while two
                             # agents were still arguing about it. always opens
                             # a draft and leaves it, for somebody who promotes
                             # every pull request by hand. always cannot be
                             # combined with auto_merge, since merging a draft
                             # means promoting it first.
instructions      = ""       # extra instructions handed to both agents with
                             # every request, for what this repository always
                             # wants that spar has no setting for: how far to
                             # go, what not to touch, what not to wait on. Each
                             # CLI reads its own conventions file already,
                             # CLAUDE.md or AGENTS.md, but only its own, and
                             # two agents given different standing instructions
                             # are not the pair this design rests on. Use
                             # --instructions to add to this for one run; it
                             # adds rather than replaces, so a flag cannot
                             # silence the standing set by accident.
max_issue_chars   = 60000    # most of ONE issue body that reaches a prompt.
                             # Sized so nothing a person wrote is ever cut. It
                             # was 2000 for triage and 6000 for implement, and
                             # silent: an agent handed half an issue judges and
                             # builds the half it saw, with no way to know the
                             # rest existed. A cut is now said out loud, in the
                             # log and in the prompt, and never lands mid line
                             # or inside a code fence.
checkin_trust     = "write"  # write | anyone. Whose comments `spar checkin`
                             # will act on. Answering is for everybody; making
                             # a change means a commit pushed to somebody's
                             # branch because a stranger typed a sentence, so
                             # by default only somebody GitHub says can write
                             # here can cause one. Note that on a repository
                             # you do not own, the author of a pull request is
                             # a CONTRIBUTOR on their own PR, so "anyone" is
                             # what you want if you are answering your own
                             # contributors. Both agents still have to agree
                             # either way.
checkin_resolve   = true     # mark a review thread resolved when spar made the
                             # change it asked for. A thread spar disagreed
                             # with is left open whatever this says: the person
                             # who raised it has not had their say yet.
max_checkin_comments = 20    # most unanswered comments spar answers on one
                             # pull request in a run. A backstop against a long
                             # argument being read back to somebody, not a
                             # target.
max_triage_chars  = 200000   # most every issue body TOGETHER may add to one
                             # triage prompt. Triage reads the whole queue at
                             # once, so the queue is the only unbounded thing
                             # here. Past this, whole issues wait for the next
                             # run rather than every issue losing its tail: a
                             # verdict is posted on the issue and can close it,
                             # so judging one on part of what it says is worse
                             # than not having reached it yet.

# One key per kind of call, so a value means what its name says. A call with no
# key set falls back to round_1 or rest, which is what the schedule used to be,
# and then to the effort the agent's own block asked for.
#
# Values are each CLI's own vocabulary: `ultra` is not a value the claude preset
# accepts, and `max` means different things to each. Where the two agents do not
# share a word, put the schedule under [agents.NAME.effort_schedule] instead,
# with exactly these keys. `spar doctor` says when a value is not one the agent
# that would receive it is known to accept.
[loop.effort_schedule]
triage      = "low"          # both agents, over the whole queue, once per wave.
                             # The most expensive call in a run, and the one the
                             # two key schedule never mentioned.
implement   = "high"         # writing the first draft
review_1    = "ultra"        # the deep first review
review_rest = "high"         # later rounds, which see a small delta
respond     = "high"         # the author answering a review
close       = "high"         # the closing merge safety pass
screen      = "low"          # the follow-up screen, one call for the queue
checkin     = "high"         # judging the comments other people left
split       = "high"         # proposing and checking a split
# round_1   = "ultra"        # read by any call above with no key of its own
# rest      = "high"         # the same, for later rounds and the close

[style]
ban_em_dash        = true
ban_ai_attribution = true

# What made a PR thread unreadable was never the length of the findings, it was
# spar narrating itself. So spar composes every comment from structured fields,
# and that is where brevity comes from.
#
# The lengths below are safety valves, not editors. They are sized so real
# content is never touched, and when one does fire it finishes the sentence in
# progress rather than stopping mid thought. A reader who cannot act on a
# finding has been given nothing, and the characters saved bought nothing.
terse              = true

# How much of its own working spar narrates into a PR thread. The agents never
# read the thread, so none of this affects the loop.
#   outcome  one comment at the end, and only if it has something to say
#   rounds   a comment per review and per response, an audit trail
#   none     never comment on a PR; everything goes to the terminal
pr_comments        = "outcome"
                             # Set this to "none" and spar never comments on a
                             # pull request in any mode, which is the standing
                             # equivalent of `spar review --dry-run`.
max_title_chars    = 140     # a finding, issue, or PR title. Never ellipsised:
                             # a title ending in "..." reads as broken.
max_summary_chars  = 2000    # a verdict or a refutation's argument
max_detail_chars   = 6000    # a blocking finding's explanation, in the thread
max_body_chars     = 8000    # a PR body
max_issue_body_chars = 20000 # a filed issue's body. Far larger on purpose: a
                             # comment is read with the diff in front of you,
                             # an issue is picked up cold months later. Fenced
                             # code blocks are never truncated and never count
                             # against this at all, so steps to reproduce and
                             # the offending snippet always survive.
